spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# --- customer-service ---
spring.cloud.gateway.server.webflux.routes[0].id=customer-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://customer-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/customers/**

# --- vehicle-service ---
spring.cloud.gateway.server.webflux.routes[1].id=vehicle-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://vehicle-service
